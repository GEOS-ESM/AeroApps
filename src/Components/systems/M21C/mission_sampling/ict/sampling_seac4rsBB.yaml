#
# Configuration file for sampling a GEOS experiment

# model control files
model_aer_ctl: inst3_aer_Nv
model_other_ctl:
    -

# location of merged dc-8 files
mergefiles: /discover/nobackup/acollow/AeroApps/AeroApps/src/Components/systems/M21C/mission_sampling/ict/SEAC4RS

# output directory for sampled files
sampled_outdir: /discover/nobackup/acollow/AeroApps/AeroApps/src/Components/systems/M21C/mission_sampling/ict/SEAC4RS/MERRA-21C

# Location of the aerosol property configuration file
large_config: g2g_large.yaml
large_submicron_config: g2g_large_submicron.yaml
ams_config: g2g_ams.yaml
sp2_config: g2g_sp2.yaml

#Inlet cutoff size
pmsize: 1
sp2size: 0.55

#Nav Variable Names
lon: LONGITUDE
lat: LATITUDE

# flags for which calculations you want to do
do_large_aop: False
do_large_submicron_aop: False
do_ams: True
do_sp2: True

flight_dates:
  - "20130806"
  - "20130816"
  - "20130819"
  - "20130826"
  - "20130827"
  - "20130906"
  - "20130909"
  - "20130911"
  - "20130923"
  
exp_id: "e5303_m21c_jan08"
tmp_dir: "/discover/nobackup/acollow/temp_regrid"
merra21c_archive: "/discover/nobackup/projects/gmao/merra21c/archive"

sulfate:
  obs: Sulfate-lt-1um_AMS-60s
  m21c: SU
  m2: SU
oc:
  obs: Org-lt-1um_AMS-60s
  m21c: OC+BR
  m2: OC
nitrate:
  obs: Nitrate-lt-1um_AMS-60s
  m21c: NI
altitude: 
  obs: GPS_ALT
  obsunits: m
  m21c: H
