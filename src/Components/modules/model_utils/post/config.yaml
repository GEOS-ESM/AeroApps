# This yaml file is used to identify what the forecasts are being evaluated against,
# the date range for the evaluation,
# and the temproral resolution of the evaluation.
paths       :
  observations: "/css/gmao/dp/gds/AeroObs/AERONET.v3/Level1_5/"
  model1      : "/discover/nobackup/projects/gmao/osse2/HWT/CONUS02KM/Feature-c2160_L137/forecasts/"
    # model1 currently set to high res model
  model2      : "/discover/nobackup/projects/gmao/geos_fp_arch/f5430_fp/chem/Y2026"
    # model2 currently set to fp model

dates       :
  start       : "2026-06-01 00:00:00"
  end         : "2026-06-15 00:00:00"

evaluation  :
  # To change the datasets evaluated, comment out unwanted dataset
  - "aeronet"
  - "forecast"
  - "analysis"
  
temporal_res: "hourly" # can be hourly, daily, or monthly

time_step   : '12h'  # time between model runs (12 or 24 hours)

fcst_period : "72" # furtherest time from model run to analyze

eval_bins   : "24" # number of hours in each bin for evaluation
  
