#
# Configuration file for sampling a GEOS experiment

# model control files
model_baseline: inst3d_aer_v_aaqoxgmi_2019
model_oxh     : inst3d_aer_v_aaqoxh24crt_2019
model_oxm     : inst3d_aer_v_aaqoxm24crt_2019

# do preprocessing, if false reads in from zarr file
do_preprocess: False


# which plots to make
do_ts_delta: False
do_kde: False
do_scatter: False
do_map_mae: False
do_map_mb: True

# location and years of of AMoN data
amon_site_map: /discover/nobackup/projects/gmao/iesa/aerosol/data/AeroObs/AMoN/amon_silte_list.csv
amon_data_dir: /discover/nobackup/projects/gmao/iesa/aerosol/data/AeroObs/AMoN/AMoN-ALL-W-s.csv

# directory for sampled files
sampled_outdir: ./sampled/amon

# directory for plot files
plot_outdir: ./plots/amon

