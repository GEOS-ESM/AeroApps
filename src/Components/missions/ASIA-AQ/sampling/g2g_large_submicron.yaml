#
# GEOS Aerosol Mie table Definition for each of species.
# This example is for calculating submicron aerosol concentrations to compare to LARGE aerosol optical property observations for a nominal GOCART-2G Model Configuration.
# Note that the two largest Nitrate bins should not be included in the calculation of submicron mass, however we keep them in for now to be consistent with the other LARGE yaml, but will set these bins to zero mass inside the aaq_derived code
# Note also that NH4 is not included because it is not radiatively active
# The order of the tracers and rhod correspond to the bins in the optics netcdf files.
#
#  rhod: particle density in kg m-3
#  shapefactor: factor that accounts for aerodynamic resistance of non-spherical particles
#               this is used to calculate the aerodynamic radius for PM calculations when the aerodymic flag is turned on
#               see the following reference for further documentation
#               GMAO Office Note No. 22 (Version 1.1):
#               Collow, A., V. Buchard, M. Chin, P. Colarco, A. Darmenov, and A. da Silva, 2023.
#               Supplemental Documentation for GEOS Aerosol Products
#   pmconversion: set to AMS to indicate using AMS transmission function.
#                 This was derived from a figure from Jose Jimenez wherein the
#                 AMS transmission linearly decreases between 0.3 and 0.8 microns.
#

DU001:
  monoFile: ExtData/chemistry/AerosolOptics/v1.0.0/x/optics_DU.v15_3.nc4
  bandFile: ExtData/chemistry/AerosolOptics/v1.0.0/x/opticsBands_DU.v15_3.RRTMG.nc4
  tracers:
    - DU001
  bin:
    - 1
  shapefactor: 1.4
  rhod:
    - 2500
  pmconversion: 1.0

